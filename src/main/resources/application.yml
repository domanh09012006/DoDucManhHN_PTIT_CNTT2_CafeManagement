spring:
  application:
    name: CoffeeManagement

  datasource:
    url: jdbc:mysql://localhost:3306/coffee_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080
  servlet:
    context-path: /

application:
  jwt:
    secret-key: 4A614E645267556B58703273357638792F423F4528472B4B6250655368566D59
    access-token-expiration: 900000        # 15 minutes in ms
    refresh-token-expiration: 604800000    # 7 days in ms

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.example.coffeemanagement: DEBUG
    org.springframework.security: DEBUG
